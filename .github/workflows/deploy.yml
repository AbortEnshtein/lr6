# CI/CD сайта-визитки. Запускается при каждом push в main (и на pull request — без публикации).
#
#   check ──┬── pages-build ── pages-deploy      → GitHub Pages (статическая копия)
#           └── docker (сборка → smoke-тест → push в GHCR)
#
# Vercel подключён к репозиторию напрямую и собирает полную версию сам, без этого файла.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Автопроверки качества: ESLint + Stylelint + юнит-тесты (в Docker, как локально: make check)
  check:
    name: Линтеры и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Проверки в контейнере
        uses: docker/build-push-action@v7
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Статическая сборка для GitHub Pages
  pages-build:
    name: Сборка для GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Настройка Pages
        id: pages
        uses: actions/configure-pages@v6
      - uses: docker/setup-buildx-action@v4
      - name: Статический экспорт Next.js в ./out
        uses: docker/build-push-action@v7
        with:
          context: .
          target: static
          outputs: type=local,dest=out
          build-args: |
            PAGES_BASE_PATH=${{ steps.pages.outputs.base_path }}
            FULL_SITE_URL=${{ vars.FULL_SITE_URL }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
      - name: Упаковка артефакта
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # 3. Публикация на GitHub Pages
  pages-deploy:
    name: Публикация на GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # 4. Docker-образ полной версии: сборка → проверка в работе → публикация в GitHub Container Registry
  docker:
    name: Docker-образ
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      APP_IMAGE: vizitka:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Сборка образа
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Тестовые переменные окружения
        run: |
          HASH_LINE=$(docker run --rm -v "$PWD":/app:ro -w /app node:22-alpine \
            node scripts/hash-password.mjs "ci-password-123" | grep ADMIN_PASSWORD_HASH)
          {
            echo "ADMIN_USERNAME=ci-admin"
            echo "$HASH_LINE"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Запуск сайта + Redis через docker compose
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Smoke-тест
        env:
          SMOKE_USER: ci-admin
          SMOKE_PASSWORD: ci-password-123
        run: sh scripts/smoke-test.sh http://localhost:3000

      - name: Логи при ошибке
        if: failure()
        run: docker compose logs

      - name: Остановка
        if: always()
        run: docker compose down -v

      - name: Теги образа
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Вход в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
